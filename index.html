<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Digiplanes</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* colours are set per plane from themes.js (theme.ui); the HUD is drawn like a technical drawing */
  :root { --cy: #8fe8ff; --acc: #ffd27a; --ink: #e9ecff; --bg: #2a2c86; --panel: rgba(18,20,80,.55); --danger: #ff4f8b;
    --hair: color-mix(in srgb, var(--ink) 38%, transparent); --faint: color-mix(in srgb, var(--ink) 18%, transparent);
    --mono: 'IBM Plex Mono', ui-monospace, monospace; --num: 'Chakra Petch', ui-monospace, monospace; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--mono); }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; } /* touch drags steer, never scroll or zoom */
  .hud { position: fixed; pointer-events: none; }

  /* sheet border, rulers and registration corners */
  #frame { inset: 10px; border: 1px solid var(--faint); }
  #frame::before, #frame::after { content: ''; position: absolute; }
  #frame::before { left: 0; right: 0; top: 0; height: 7px;
    background: repeating-linear-gradient(90deg, var(--hair) 0 1px, transparent 1px 10px),
      repeating-linear-gradient(90deg, var(--ink) 0 1px, transparent 1px 50px);
    background-size: 100% 4px, 100% 7px; background-repeat: no-repeat; opacity: .55; }
  #frame::after { top: 0; bottom: 0; left: 0; width: 7px;
    background: repeating-linear-gradient(180deg, var(--hair) 0 1px, transparent 1px 10px),
      repeating-linear-gradient(180deg, var(--ink) 0 1px, transparent 1px 50px);
    background-size: 4px 100%, 7px 100%; background-repeat: no-repeat; opacity: .55; }
  .corner { position: absolute; width: 16px; height: 16px; border-color: var(--ink); border-style: solid; border-width: 0; }
  .corner.tl { left: -1px; top: -1px; border-left-width: 2px; border-top-width: 2px; }
  .corner.tr { right: -1px; top: -1px; border-right-width: 2px; border-top-width: 2px; }
  .corner.bl { left: -1px; bottom: -1px; border-left-width: 2px; border-bottom-width: 2px; }
  .corner.br { right: -1px; bottom: -1px; border-right-width: 2px; border-bottom-width: 2px; }

  #top { top: 26px; left: 30px; right: 30px; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .brand { font-family: var(--num); font-weight: 700; letter-spacing: .32em; font-size: 15px; color: var(--cy); }
  #title { margin-top: 3px; font-size: 10px; letter-spacing: .28em; opacity: .75; }
  .tabs { margin-top: 10px; display: flex; gap: 0; pointer-events: auto; border: 1px solid var(--hair); width: max-content; }
  .tabs button, .tabs a { font: inherit; font-size: 10px; letter-spacing: .22em; color: var(--ink); background: transparent;
    border: 0; border-right: 1px solid var(--hair); padding: 5px 10px; cursor: pointer; opacity: .6; text-decoration: none; }
  .tabs > :last-child { border-right: 0; }
  .tabs a:hover { opacity: 1; }
  .tabs button.active { opacity: 1; background: var(--faint); }

  /* stats as numbered callouts */
  #stats { display: flex; text-align: left; border-top: 1px solid var(--hair); }
  #stats > div { padding: 4px 14px 2px 8px; border-left: 1px solid var(--hair); min-width: 74px; }
  #stats label { display: block; font-size: 9px; letter-spacing: .2em; opacity: .7; }
  #stats label em { font-style: normal; opacity: .6; margin-right: 4px; }
  #stats span { font-family: var(--num); font-size: 21px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .swatch { display: inline-block; width: 15px; height: 15px; background: var(--sw); outline: 1px solid var(--ink); outline-offset: 2px; vertical-align: -1px; }

  /* meters drawn as dimension lines: |<—— value ——>| with 10% ticks */
  .dim { position: relative; margin-top: 10px; height: 12px; }
  .dim .line { position: absolute; left: 0; right: 0; top: 5px; height: 1px; background: var(--hair); }
  .dim::before, .dim::after { content: ''; position: absolute; top: 0; width: 1px; height: 12px; background: var(--ink); }
  .dim::before { left: 0; } .dim::after { right: 0; }
  .dim .ticks { position: absolute; left: 0; right: 0; top: 3px; height: 5px;
    background: repeating-linear-gradient(90deg, var(--hair) 0 1px, transparent 1px 10%); }
  .dim .val { position: absolute; left: 0; top: 4px; height: 3px; width: 0; background: var(--cy); transition: width .2s; }
  .dim .tag { position: absolute; right: 6px; top: -11px; font-size: 9px; letter-spacing: .2em; opacity: .8; }
  #fill.full { background: var(--acc); }
  #fuelbar { background: var(--ink); }
  #fuelwrap.low .val { background: var(--danger); }
  #fuelwrap.low .tag { color: var(--danger); animation: blink .5s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  body[data-mode=puzzle] .dim, body[data-mode=puzzle] #arrow { display: none !important; }

  #feed { top: 132px; right: 30px; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .ev { font-size: 12px; letter-spacing: .16em; color: var(--ink); animation: rise 1.8s forwards; display: flex; align-items: center; gap: 8px; }
  .ev::before { content: ''; width: 26px; height: 1px; background: currentColor; opacity: .6; }
  .ev.warn { color: var(--danger); }
  @keyframes rise { from { opacity: 0; transform: translateX(8px); } 12% { opacity: 1; transform: none; } 75% { opacity: 1; } to { opacity: 0; } }

  /* world-anchored callouts */
  #pops { inset: 0; }
  .pop { position: absolute; transform: translate(0, -100%); font-size: 12px; letter-spacing: .14em; color: var(--ink); white-space: nowrap;
    padding: 0 0 2px 22px; border-bottom: 1px solid currentColor; animation: pop 1.1s ease-out forwards; }
  .pop::before { content: ''; position: absolute; left: 0; bottom: -1px; width: 22px; height: 1px; background: currentColor; transform-origin: left; transform: rotate(40deg); }
  .pop.gold { color: var(--acc); }
  .pop.big { color: var(--acc); font-family: var(--num); font-size: 20px; font-weight: 600; }
  @keyframes pop { from { opacity: 0; } 12% { opacity: 1; } 70% { opacity: 1; } to { opacity: 0; transform: translate(0, -160%); } }

  /* portal marker: reticle with label, or an edge arrow when off screen */
  #arrow { display: none; width: 0; height: 0; }
  #arrow::before { content: ''; position: absolute; left: -14px; top: -14px; width: 26px; height: 26px; border: 1px solid var(--acc); border-radius: 50%;
    background: linear-gradient(var(--acc), var(--acc)) center / 1px 100% no-repeat, linear-gradient(var(--acc), var(--acc)) center / 100% 1px no-repeat;
    animation: spin 4s linear infinite; }
  #arrow::after { content: attr(data-label); position: absolute; left: 18px; top: -24px; font-size: 9px; letter-spacing: .25em; color: var(--acc);
    border-bottom: 1px solid var(--acc); padding-bottom: 1px; }
  #arrow.edge::before { left: -12px; top: -12px; width: 0; height: 0; border-radius: 0; background: none; border: 12px solid transparent; border-left: 18px solid var(--acc);
    transform: rotate(var(--rot)); transform-origin: 12px 12px; animation: none; }
  #arrow.edge::after { left: -34px; top: 18px; border-bottom: 0; } /* keep the label next to the edge arrow */
  @keyframes spin { to { transform: rotate(360deg); } }
  /* urgent: bigger, blinking marker */
  #arrow.urgent::before { left: -24px; top: -24px; width: 46px; height: 46px; border-width: 2px; animation: spin 4s linear infinite, blink .6s steps(2) infinite; }
  #arrow.urgent::after { left: 30px; top: -34px; font-size: 12px; }
  #arrow.edge.urgent::before { left: -20px; top: -20px; border-width: 20px; border-left-width: 30px; transform-origin: 20px 20px; animation: blink .6s steps(2) infinite; }

  /* centre prompt, drawn like a callout box */
  #prompt { left: 50%; bottom: 21%; transform: translateX(-50%); display: none; font-size: 15px; letter-spacing: .24em; color: var(--acc);
    border: 1px solid var(--acc); padding: 9px 18px 9px 30px; background: var(--panel); white-space: nowrap; animation: blink 1s steps(2) infinite; }
  #prompt::before { content: '▶'; position: absolute; left: 11px; top: 8px; font-size: 13px; }
  #prompt.on { display: block; }

  #danger { inset: 0; opacity: 0; background: radial-gradient(ellipse at center, transparent 55%, color-mix(in srgb, var(--danger) 55%, transparent) 100%); transition: opacity .15s; }

  /* notes block */
  #help { left: 30px; bottom: 26px; max-width: 520px; font-size: 11px; line-height: 1.55; background: var(--panel);
    border: 1px solid var(--hair); padding: 8px 12px; backdrop-filter: blur(3px); }
  #help::before { content: 'NOTES'; display: block; font-size: 9px; letter-spacing: .3em; opacity: .6; margin-bottom: 3px; }
  #help b { color: var(--cy); letter-spacing: .2em; font-weight: 500; }
  #help i { color: var(--acc); font-style: normal; }
  .keys { margin-top: 6px; opacity: .85; font-size: 10px; }
  .keys span { border: 1px solid var(--hair); padding: 0 5px; margin-right: 3px; }

  /* drawing title block */
  #tblock { right: 30px; bottom: 26px; display: grid; grid-template-columns: auto auto; font-size: 10px; letter-spacing: .14em;
    border: 1px solid var(--hair); background: var(--panel); backdrop-filter: blur(3px); }
  #tblock > div { padding: 3px 8px; border-bottom: 1px solid var(--faint); }
  #tblock > div:nth-child(odd) { border-right: 1px solid var(--faint); opacity: .6; }
  #tblock > div:nth-last-child(-n+2) { border-bottom: 0; }
  #tblock .v { font-variant-numeric: tabular-nums; min-width: 128px; }

  #overlay { inset: 0; display: none; place-content: center; text-align: center; background: color-mix(in srgb, var(--bg) 45%, transparent); padding: 16px; }
  #overlay.on { display: grid; }
  #overlay .sheet { border: 1px solid var(--hair); padding: 22px 34px; background: var(--panel); position: relative; }
  #overlay .sheet::before { content: 'SHEET'; position: absolute; left: 8px; top: 5px; font-size: 9px; letter-spacing: .3em; opacity: .5; }
  #overlay h2 { margin: 0; font-family: var(--num); letter-spacing: .35em; font-size: 32px; color: var(--cy); }
  #overlay p { font-size: 15px; margin: 12px 0; max-width: 620px; }
  #overlay b { color: var(--acc); font-weight: 500; }
  #overlay small { font-size: 11px; letter-spacing: .2em; opacity: .75; }
  @media (max-width: 760px) { #stats > div { min-width: 0; padding: 3px 8px 1px 6px; } #stats span { font-size: 15px; }
    #help { right: 30px; bottom: 116px; font-size: 10px; } #prompt { font-size: 11px; letter-spacing: .12em; bottom: 230px; } #tblock { left: 30px; right: 30px; } #overlay h2 { font-size: 22px; } }
  /* touch controls: only on coarse pointers (phones, tablets); desktop never sees them */
  #touch { display: none; }
  @media (pointer: coarse) {
    html, body { touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    #touch { display: block; position: fixed; inset: 0; pointer-events: none; }
    #touch button { pointer-events: auto; touch-action: none; font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--hair);
      backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); padding: 0; cursor: pointer; }
    #touch button.held { background: color-mix(in srgb, var(--cy) 35%, transparent); border-color: var(--cy); }
    #tpad { position: absolute; left: calc(18px + env(safe-area-inset-left)); bottom: calc(18px + env(safe-area-inset-bottom));
      display: grid; grid-template-columns: repeat(3, 46px); gap: 6px; }
    #tpad button { height: 40px; font-size: 11px; letter-spacing: .12em; }
    #t-hop { position: absolute; right: calc(22px + env(safe-area-inset-right)); bottom: calc(22px + env(safe-area-inset-bottom));
      width: 88px; height: 88px; border-radius: 50%; font-family: var(--num); font-weight: 700; font-size: 15px; letter-spacing: .25em;
      color: var(--cy); border: 2px solid var(--cy); }
    body[data-mode=puzzle] [data-only=cage], body[data-mode=cage] [data-only=puzzle] { display: none; }
    /* the notes panel and title block don't fit beside the controls: notes open from the ? button, title block hides */
    #help { display: none; left: 18px; right: 18px; bottom: auto; top: 50%; transform: translateY(-50%); max-width: none; z-index: 2; }
    body.show-help #help { display: block; }
    #tblock { display: none; }
    #prompt { bottom: calc(132px + env(safe-area-inset-bottom)); }
  }
  @media (pointer: coarse) and (max-width: 760px), (pointer: coarse) and (max-height: 500px) {
    #frame { inset: 6px; }
    #top { top: 16px; left: 18px; right: 18px; gap: 10px; }
    .brand { font-size: 12px; } #title { font-size: 9px; }
    .tabs { margin-top: 6px; } .tabs button, .tabs a { padding: 7px 8px; font-size: 9px; letter-spacing: .14em; }
    #stats > div { min-width: 0; padding: 3px 7px 1px 5px; } #stats span { font-size: 15px; } #stats label { font-size: 8px; letter-spacing: .12em; }
    #feed { top: 120px; right: 18px; } .ev { font-size: 10px; }
    #prompt { font-size: 11px; letter-spacing: .12em; padding: 7px 12px 7px 26px; }
    #overlay .sheet { padding: 16px 18px; } #overlay h2 { font-size: 20px; letter-spacing: .25em; } #overlay p { font-size: 13px; }
  }
  /* portrait phone: stats go under the brand instead of beside it */
  @media (pointer: coarse) and (max-width: 560px) {
    #top { flex-direction: column; align-items: stretch; gap: 8px; }
    #stats > div { flex: 1; }
    #feed { top: 150px; }
  }
  /* landscape phone: stats beside the brand would squeeze; keep the top band short */
  @media (pointer: coarse) and (max-height: 500px) {
    #top { top: 12px; } #feed { top: 84px; }
    #overlay { padding: 8px; } #overlay p { margin: 6px 0; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud" id="danger"></div>
<div class="hud" id="frame"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i></div>
<div class="hud" id="pops"></div>
<div class="hud" id="arrow" data-label="PORTAL"></div>
<div class="hud" id="prompt"></div>
<div class="hud" id="top">
  <div>
    <div class="brand">DIGIPLANES</div>
    <div id="title"></div>
    <div class="tabs"><button data-mode="cage">1 · CAGE</button><button data-mode="puzzle">2 · PUZZLE</button><a href="synth/index.html" target="_blank" title="Glass FM: the soundtrack synth">♪ SYNTH</a></div>
  </div>
  <div>
    <div id="stats"></div>
    <div class="dim"><i class="line"></i><i class="ticks"></i><i class="val" id="fill"></i><span class="tag">LOAD</span></div>
    <div class="dim" id="fuelwrap"><i class="line"></i><i class="ticks"></i><i class="val" id="fuelbar"></i><span class="tag" id="fueltxt">FUEL</span></div>
  </div>
</div>
<div class="hud" id="feed"></div>
<div class="hud" id="help"></div>
<div class="hud" id="tblock">
  <div>DWG</div><div class="v" id="tb-dwg">DP-01</div>
  <div>PLANE</div><div class="v" id="tb-plane">—</div>
  <div>SCALE</div><div class="v">1 : 20</div>
  <div>POS</div><div class="v" id="tb-pos">—</div>
  <div>AUDIO</div><div class="v" id="tb-audio">ON · M</div>
</div>
<div class="hud" id="overlay"></div>
<div id="touch">
  <div id="tpad">
    <button data-key="BracketLeft" data-only="cage" aria-label="previous plane">◀</button>
    <button data-key="BracketRight" data-only="cage" aria-label="next plane">▶</button>
    <button data-key="KeyZ" data-only="puzzle" aria-label="undo">UNDO</button>
    <button data-key="KeyR" aria-label="retry">R</button>
    <button data-key="KeyN" aria-label="skip">SKIP</button>
    <button data-key="KeyM" id="t-mute" aria-label="mute">♪</button>
    <button id="t-help" aria-label="notes">?</button>
  </div>
  <button id="t-hop" data-key="Space" data-only="cage" aria-label="hop">HOP</button>
</div>
<script src="synth/engine.js"></script> <!-- Glass FM: plays each plane's FM song (music/fm/<plane>.js) -->
<script type="module" src="src/main.js"></script>
</body>
</html>
